<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraEdit</title>

    <style>

        body {
    margin: 0;
    padding: 40px;
    background-color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 90%;
    margin: auto;
    padding: 25px;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;

    border: none;
}

.item {
    height: 160px;
    padding: 20px;

    background-color: white;
    border: 1px solid #ddd;
    border-radius: 15px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,0.1);

    transition: 0.2s;
}

.item:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.18);
}

.head {
    font-size: 28px;
    font-weight: bold;
    margin-top: 10px;
}

.dowload {
    width: 100px;
    height: auto;

    margin: 30px auto 0;
    padding: 8px 0;

    background-color: #ffd000;
    border-radius: 7px;

    transition: 0.2s;
}

.dowload:hover {
    background-color: #ffbd00;
    transform: scale(1.05);
}

a {
    color: black;
    text-decoration: none;
    font-weight: bold;
}

    </style>
</head>
<body>
